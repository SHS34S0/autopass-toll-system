<!DOCTYPE html>

<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link href="/static/styles.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            let fuel = document.querySelectorAll(".fuel-selector");

            for (let i = 0; i < fuel.length; i++) {
                fuel[i].addEventListener("click", function () {

                    let value = this.querySelector("input").value;

                    let names = {
                        electric: "Electric Vehicle discount 50%",
                        hybrid: "Hybrid Vehicle discount 30%",
                        gasoline: "Gasoline Car discount 20%",
                        diesel: "Diesel Car discount 20%"
                    };

                    document.querySelector(".information").innerHTML = names[value];

                });
            }

        });
    </script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#144771;">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">AutoPass</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">

                    <a class="nav-link active" aria-current="page" href="/">Home</a>
                    {% if user_id %}
                    <a class="nav-link" href="/dashboard">My profile</a>
                    <a class="nav-link" href="#">Pricing</a>
                    {% endif %}
                </div>
                {% if user_id %}

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link aut-btn" href="/logout">Log Out</a></li>
                </ul>
                {% else %}
                <ul class="navbar-nav ms-auto ">
                    <li class="nav-item"><a class="nav-link aut-btn" href="/register">Register</a></li>
                    <li class="nav-item"><a class="nav-link aut-btn" href="/login">Log In</a></li>
                </ul>
                {% endif %}

            </div>
        </div>
    </nav>

    <main>
        <div class="bg-overlay p-5">
            {% block content %}{% endblock %}
        </div>
    </main>

    <div class="mt-5">
        <footer class="text-center">Serhii Treiser 2026</footer>

    </div>
</body>

</html>
